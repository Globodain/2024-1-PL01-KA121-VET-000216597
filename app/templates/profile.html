{% extends "base.html" %}

{% block content %}
  <h1>{{ current_user.username }}'s Profile</h1>
  <ul>
    <li><strong>Username:</strong> {{ current_user.username }}</li>
    <li><strong>Email:</strong> {{ current_user.email }}</li>
  </ul>
  <a href="{{ url_for('edit_profile') }}">Edit Profile</a>
{% endblock %}
